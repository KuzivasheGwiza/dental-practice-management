name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dentalcare-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/dentalcare-react/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            frontend/dentalcare-react/playwright-report/
            frontend/dentalcare-react/test-results/
          retention-days: 7

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/dental-practice-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/dental-practice-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore DentalPracticeSystem.sln
      - run: dotnet build DentalPracticeSystem.sln --configuration Release --no-restore
